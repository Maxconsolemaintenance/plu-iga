<script>
/* PLU IGA APK: pont natif pour la reconnaissance vocale (SpeechRecognition n'existe pas dans WebView) */
(function(){
  if (!window.AndroidVoice) return;
  var current=null;
  window.__voiceResult=function(t){var r=current;current=null;if(!r)return;
    if(r.onresult)r.onresult({results:[[{transcript:t,confidence:1}]]});if(r.onend)r.onend();};
  window.__voiceError=function(code){var r=current;current=null;if(!r)return;
    if(r.onerror)r.onerror({error:code});if(r.onend)r.onend();};
  function NativeSR(){this.lang="fr-CA";this.interimResults=false;this.maxAlternatives=1;this.continuous=false;}
  NativeSR.prototype.start=function(){current=this;AndroidVoice.start(this.lang||"fr-CA");};
  NativeSR.prototype.stop=function(){/* le moteur natif s'arrete seul a la fin de la phrase */};
  NativeSR.prototype.abort=function(){current=null;AndroidVoice.cancel();};
  window.SpeechRecognition=NativeSR;window.webkitSpeechRecognition=NativeSR;
})();
</script>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#111;color:#eee;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.header{padding:10px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.header input,.header select{padding:10px;font-size:15px;border:none;border-radius:8px;background:#222;color:#fff}
.header input{flex:1;min-width:100px}
.btn{background:#333;color:#fff;border:none;padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.btn.p{background:#2e7d32}
.btn.voice{background:#1565c0;padding:16px 20px;font-size:22px;min-width:60px;min-height:52px}
.results{padding:8px;flex:1;overflow-y:auto}
.item{background:#1a1a1a;border-radius:10px;padding:10px;margin-bottom:6px;display:flex;gap:10px;align-items:center;cursor:pointer}
.item:active{background:#2a2a2a}
.thumb{width:44px;height:44px;border-radius:6px;background:#333;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.72em;color:#888;margin-top:2px}
.plu{color:#4caf50;font-weight:bold}
.detail{padding:12px;text-align:center;flex:1;overflow-y:auto}
.dname{font-size:1.25em;font-weight:700;margin:12px 0 4px}
.dcat{color:#888;font-size:.85em;margin-bottom:10px}
.bbox{background:#fff;border-radius:12px;padding:12px;margin:8px auto;max-width:260px}
.plubig{font-size:2em;font-weight:800;color:#4caf50;margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.tag{background:#333;padding:3px 8px;border-radius:10px;font-size:.72em}
.notes{font-size:.8em;color:#888;margin-top:4px}
.form{padding:12px}
.form input,.form textarea{width:100%;padding:11px;margin-bottom:8px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:15px}
.factions{display:flex;gap:6px;margin-top:8px}
.back{position:absolute;top:10px;left:10px;z-index:20}
.empty{text-align:center;padding:30px;color:#666}
.search-inline{padding:8px;background:#1a1a1a;border-top:1px solid #333;display:flex;gap:6px;align-items:center}
.search-inline input{flex:1;padding:10px;border-radius:8px;border:none;background:#222;color:#fff;font-size:15px}
#camInput{display:none}

.btn.voice{background:#1565c0;padding:16px 20px;font-size:22px;min-width:60px;min-height:52px}
#floatMic{
  position:fixed;
  bottom:24px;
  right:20px;
  width:64px;
  height:64px;
  border-radius:50%;
  background:#1565c0;
  color:#fff;
  border:none;
  font-size:28px;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
  z-index:9999;
  touch-action:manipulation;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
#floatMic:active{background:#0d47a1;transform:scale(.95)}
.ph-thumb{max-width:120px;max-height:120px;border-radius:8px;object-fit:cover;cursor:pointer}
.ph-big{max-width:240px;max-height:240px}
.setp{padding:14px;padding-top:56px;flex:1;overflow-y:auto}
.setp h3{margin:14px 0 8px}
.setp input{width:100%;padding:11px;margin-bottom:8px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:15px}
.logrow{background:#1a1a1a;border-radius:10px;padding:10px;margin-bottom:6px;font-size:.85em}
.logrow .lc{color:#aaa;font-size:.9em;margin-top:4px;white-space:pre-wrap}
</style>

function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}

function getTags(){
  const t = new Set();
  P.forEach(p=>(p.tags||[]).forEach(x=>t.add(x)));
  return [...t].sort();
}

function updateTagFilter(){
  const sel = document.getElementById("tagF");
  const c = sel.value;
  sel.innerHTML = '<option value="">Tous tags</option>' + getTags().map(t=>`<option value="${t}">${t}</option>`).join("");
  if(getTags().includes(c)) sel.value = c;
}

function getCategories(){
  const c = new Set();
  P.forEach(p => { if(p.cat && p.cat.trim()) c.add(p.cat.trim()); });
  return [...c].sort((a,b)=>a.localeCompare(b, 'fr'));
}





function updateCatFilter(){
  const sel = document.getElementById("catF");
  const current = sel.value;
  const cats = getCategories();
  sel.innerHTML = '<option value="">Toutes catégories</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join("");
  if(cats.includes(current)) sel.value = current;
}

function manageCategories(){
  const cats = getCategories();
  if(!cats.length){ alert("Aucune catégorie."); return; }
  let msg = "Catégories actuelles:\n" + cats.map((c,i)=>`${i+1}. ${c}`).join("\n");
  msg += "\n\nEntrez le numéro à supprimer, ou un nouveau nom pour en ajouter, ou 'renommer' pour renommer.";
  const input = prompt(msg);
  if(!input) return;
  const num = parseInt(input);
  if(!isNaN(num) && num >= 1 && num <= cats.length){
    const toDelete = cats[num-1];
    if(confirm(`Supprimer la catégorie "${toDelete}" ?\nLes produits seront déplacés vers "Standard".`)){
      P.forEach(p => { if(p.cat === toDelete) p.cat = "Standard"; });
      saveLocal();
      updateCatFilter();
      updateTagFilter();
      renderMain();
      alert(`Catégorie "${toDelete}" supprimée.`);
    }
  } else if(input.toLowerCase() === "renommer"){
    const oldName = prompt("Nom actuel de la catégorie à renommer:");
    if(!oldName || !cats.includes(oldName)){ alert("Catégorie introuvable."); return; }
    const newName = prompt("Nouveau nom:");
    if(!newName || !newName.trim()) return;
    P.forEach(p => { if(p.cat === oldName) p.cat = newName.trim(); });
    saveLocal();
    updateCatFilter();
    renderMain();
    alert(`Renommée en "${newName.trim()}".`);
  } else {
    // Ajouter une nouvelle catégorie
    const newCat = input.trim();
    if(cats.includes(newCat)){ alert("Cette catégorie existe déjà."); return; }
    // On l'ajoute simplement en créant un produit temporaire ou on la laisse disponible via le formulaire
    alert(`Catégorie "${newCat}" disponible. Assignez-la à un produit via le formulaire pour qu'elle apparaisse.`);
  }
}

function getUsage(){
  try { return JSON.parse(localStorage.getItem("plu_usage") || "{}"); }
  catch(e) { return {}; }
}
function trackUsage(name){
  if (!name) return;
  const u = getUsage();
  const current = u[name] || 0;
  // Plafond à 10000 : au-delà, c'est déjà clairement prioritaire
  if (current < 10000) {
    u[name] = current + 1;
    try { localStorage.setItem("plu_usage", JSON.stringify(u)); } catch(e) {}
  }
}

function filterList(query){
  const nq = norm(query);
  const cat = document.getElementById("catF").value;
  const tag = document.getElementById("tagF").value;
  let items = P.filter(p=>{
    if(cat && p.cat !== cat) return false;
    if(tag && !(p.tags||[]).includes(tag)) return false;
    if(nq.length >= 1 && !norm(p.n).includes(nq) && !(p.p||"").includes(query) && !(p.c||"").includes(query)) return false;
    return true;
  });
  // Priorité: 1) PLU avant non-PLU  2) Plus utilisés  3) Meilleure correspondance
  const usage = getUsage();
  const queryWords = nq.split(/\s+/).filter(w => w.length > 2);
  items.sort((a, b) => {
    const aHas = !!(a.p && String(a.p).trim());
    const bHas = !!(b.p && String(b.p).trim());
    // PLU toujours avant non-PLU
    if (aHas && !bHas) return -1;
    if (!aHas && bHas) return 1;
    // Parmi le même groupe, plus utilisés d'abord
    const aUse = usage[a.n] || 0;
    const bUse = usage[b.n] || 0;
    if (aUse !== bUse) return bUse - aUse;
    // Puis meilleure correspondance
    if (queryWords.length) {
      const aName = norm(a.n);
      const bName = norm(b.n);
      const aScore = queryWords.filter(w => aName.includes(w)).length;
      const bScore = queryWords.filter(w => bName.includes(w)).length;
      if (aScore !== bScore) return bScore - aScore;
    }
    return 0;
  });
  return items.slice(0, 80);
}

// Extract potential PLU from barcode (only used if it matches a real product)
function extractPluFromBarcode(code) {
  if (!code) return null;
  const clean = code.replace(/[^0-9]/g, '');
  if (!clean) return null;
  
  // Strict pattern only: 02XXXXX00000 (common produce PLU barcode)
  const m = clean.match(/^0?2(\d{4,5})0{4,}$/);
  if (m) {
    const plu = m[1].replace(/^0+/, '') || '0';
    if (plu.length >= 4 && plu.length <= 5) return plu;
  }
  return null;
}

// Find product by barcode - only trust extracted PLU if it exists in the database
function findByCode(code) {
  if (!code) return null;
  const clean = code.replace(/[^0-9]/g, '');
  
  // 1. Exact CUP / barcode match (safest)
  const byCup = P.find(p => {
    const cup = (p.c || '').replace(/[^0-9]/g, '');
    return cup && cup === clean;
  });
  if (byCup) return byCup;
  
  // 2. Extracted PLU only if it matches an existing product
  const extracted = extractPluFromBarcode(code);
  if (extracted) {
    const byPlu = P.find(p => p.p === extracted);
    if (byPlu) return byPlu;
  }
  
  return null;
}

          renderMain();

          const extracted = extractPluFromBarcode(code);
          q = extracted || code;
          document.getElementById("q").value = q;
          renderMain();
        }
      }
    }catch(err){

  input.click();

// ===== Improved Voice Search (category + fuzzy) =====

function levenshtein(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i-1) === a.charAt(j-1)) {
        matrix[i][j] = matrix[i-1][j-1];
      } else {
        matrix[i][j] = Math.min(matrix[i-1][j-1]+1, matrix[i][j-1]+1, matrix[i-1][j]+1);
      }
    }
  }
  return matrix[b.length][a.length];
}

const CAT_HINTS = {
  pomme: ["pomme", "pommes", "apple", "apples"],
  banane: ["banane", "bananes", "banana"],
  orange: ["orange", "oranges"],
  poire: ["poire", "poires", "pear"],
  tomate: ["tomate", "tomates", "tomato"],
  concombre: ["concombre", "concombres", "cucumber"],
  laitue: ["laitue", "salade", "lettuce"],
  carotte: ["carotte", "carottes", "carrot"],
  oignon: ["oignon", "oignons", "onion"],
  poivron: ["poivron", "poivrons", "pepper"],
  champignon: ["champignon", "champignons", "mushroom"],
  raisin: ["raisin", "raisins", "grape"],
  fraise: ["fraise", "fraises", "strawberry"],
  bleuet: ["bleuet", "bleuets", "blueberry"],
  framboise: ["framboise", "framboises", "raspberry"],
  cerise: ["cerise", "cerises", "cherry"],
  melon: ["melon", "melons"],
  ananas: ["ananas", "pineapple"],
  mangue: ["mangue", "mangues", "mango"],
  avocat: ["avocat", "avocats", "avocado"],
  citron: ["citron", "citrons", "lemon"],
  courge: ["courge", "courges", "squash"],
  patate: ["patate", "patates", "pomme de terre", "potato"]
};

const FILLER = new Set(["des", "de", "la", "le", "les", "un", "une", "du", "et", "ou", "avec", "pour", "sorte", "type", "genre"]);

function detectCategoryHint(spoken) {
  const n = norm(spoken);
  for (const [key, words] of Object.entries(CAT_HINTS)) {
    for (const w of words) {
      if (n.includes(norm(w))) return key;
    }
  }
  return null;
}

function productMatchesCategory(p, hint) {
  if (!hint) return true;
  const pn = norm((p.n || "") + " " + (p.cat || ""));
  const hints = CAT_HINTS[hint] || [];
  return hints.some(w => pn.includes(norm(w)));
}

function cleanWords(spoken) {
  return norm(spoken)
    .split(/\s+/)
    .filter(w => w.length > 2 && !FILLER.has(w))
    .filter(w => !Object.values(CAT_HINTS).flat().some(c => norm(c) === w));
}

// Synonymes phonétiques courants (reconnaissance vocale -> vrai nom)
const PHONETIC = {
  "kirkland": "cortland",
  "portland": "cortland",
  "courtland": "cortland",
  "macintoch": "mcintosh",
  "macintosh": "mcintosh",
  "honey crisp": "honeycrisp",
  "granny smith": "granny",
  "golden delicious": "golden",
  "red delicious": "delicious",
  "gala": "gala",
  "fuji": "fuji"
};

function normalizeSpoken(spoken) {
  let s = (spoken || "").toLowerCase();
  for (const [wrong, right] of Object.entries(PHONETIC)) {
    if (s.includes(wrong)) s = s.replace(wrong, right);
  }
  return s;
}

function findBestMatches(spoken, limit = 15) {
  const normalized = normalizeSpoken(spoken);
  const hint = detectCategoryHint(normalized);
  const words = cleanWords(normalized);
  if (!words.length && !hint) return [];

  const candidates = [];
  for (const p of P) {
    // Prefer category match, but don't exclude completely if score is very good
    const catMatch = !hint || productMatchesCategory(p, hint);
    const pn = norm(p.n);
    const nameTokens = pn.split(/\s+/).filter(t => t.length >= 3);
    if (!nameTokens.length) continue;
    
    let bestScore = Infinity;
    for (const w of words) {
      for (const t of nameTokens) {
        const dist = levenshtein(w, t);
        const maxLen = Math.max(w.length, t.length, 1);
        const score = dist / maxLen;
        if (score < bestScore) bestScore = score;
        // Bonus for containment
        if (t.includes(w) || w.includes(t)) bestScore = Math.min(bestScore, 0.15);
      }
    }
    
    if (!words.length && hint && catMatch) bestScore = 0.4;
    
    // Category products get a boost (lower score = better)
    if (catMatch && hint) bestScore *= 0.7;
    
    // PLU items get priority (lower score = better)
    if (p.p && String(p.p).trim()) bestScore *= 0.6;
    
    // Accept if reasonably close
    if (bestScore <= 0.55) {
      candidates.push({ p, score: bestScore });
    }
  }
  candidates.sort((a, b) => a.score - b.score);
  return candidates.slice(0, limit).map(c => c.p);
}

function startVoice(targetInput, after) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Recherche vocale non supportée");
    resetMicBtn();
    return;
  }
  
  // Nouvelle instance à chaque fois (plus fiable sur Android)
  const rec = new SR();
  rec.lang = "fr-CA";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.continuous = false;
  
  const btn = document.getElementById("floatMic");
  if (btn) { btn.style.background = "#c62828"; btn.textContent = "🔴"; }
  
  let done = false;
  function finish() {
    if (done) return;
    done = true;
    resetMicBtn();
  }
  
  rec.onresult = e => {
    finish();
    const text = (e.results && e.results[0] && e.results[0][0]) ? e.results[0][0].transcript : "";
    if (text && targetInput) {
      const matches = findBestMatches(text);
      const cleaned = cleanWords(text).join(" ") || text.trim();
      targetInput.value = cleaned;
      if (after) after(cleaned, matches);
    }
  };
  
  rec.onerror = e => {
    finish();
    if (e.error === "not-allowed") alert("Permission micro refusée");
  };
  
  rec.onend = () => finish();
  
  try {
    rec.start();
    // Sécurité: forcer l'arrêt après 5 secondes
    setTimeout(() => {
      try { rec.stop(); } catch(e) {}
      finish();
    }, 5000);
  } catch (err) {
    finish();
    alert("Micro indisponible");
  }
}

function resetMicBtn() {
  const btn = document.getElementById("floatMic");
  if (btn) { btn.style.background = "#1565c0"; btn.textContent = "🎤"; }
}

function handleMicClick(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  startVoice(document.getElementById("q"), (text, products) => {
    q = text;
    if (products && products.length) {
      renderList(document.getElementById("res"), products);
      document.getElementById("emp").style.display = "none";
    } else {
      renderMain();
    }
  });
}

// ===== SYNCHRO GITHUB (fusion à 3 voies) =====
const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
function setStatus(t){ const el=document.getElementById("syncStatus"); if(el) el.textContent=t; }
function newId(){ return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }
function hashStr(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return (h>>>0).toString(36); }
// Donne un identifiant stable aux produits qui n'en ont pas (le même sur tous les appareils)
function ensureIds(arr){
  const seen={};
  arr.forEach(p=>{
    if(!p._id){ const k=hashStr((p.n||"")+"|"+(p.p||"")+"|"+(p.c||"")); seen[k]=(seen[k]||0)+1; p._id="h_"+k+(seen[k]>1?"_"+seen[k]:""); }
  });
  return arr;
}
function ser(p){ return p ? JSON.stringify(p) : null; }
function toMap(arr){ const m=new Map(); (arr||[]).forEach(p=>m.set(p._id,p)); return m; }
function getBase(){ try{ const b=localStorage.getItem("plu_sync_base"); return b?JSON.parse(b):null; }catch(e){ return null; } }
function setBase(arr,sha){
  try{ localStorage.setItem("plu_sync_base", JSON.stringify(arr)); if(sha) localStorage.setItem("plu_sync_sha", sha);
       localStorage.setItem("plu_sync_time", Date.now().toString()); }catch(e){ console.warn("base non sauvegardée",e); }
}
function hasLocalChanges(){
  const base=getBase(); if(!base) return true;
  if(base.length!==P.length) return true;
  const bm=toMap(base); return P.some(p=>ser(bm.get(p._id))!==ser(p));
}
// Fusion : modifications locales (depuis la dernière synchro) gagnent ; tout le reste vient de GitHub
function mergeData(base, local, remote){
  const B=toMap(base||[]), L=toMap(local), R=toMap(remote);
  const out=[]; const done=new Set(); let localWins=0, remoteNew=0;
  const pick=(id)=>{
    const b=B.get(id), l=L.get(id), r=R.get(id);
    const localChanged = base ? ser(l)!==ser(b) : (!!l && !r); // sans base (1re synchro) : GitHub gagne, ajouts locaux gardés
    if(localChanged){ if(l){ localWins++; return l; } return null; } // l absent = supprimé localement
    if(r && ser(r)!==ser(b)) remoteNew++;
    return r || null;
  };
  // produits nouveaux localement en premier (ajoutés avec unshift)
  local.forEach(p=>{ if(!R.has(p._id) && !B.has(p._id)){ const v=pick(p._id); if(v) out.push(v); done.add(p._id);} });
  remote.forEach(p=>{ if(done.has(p._id)) return; done.add(p._id); const v=pick(p._id); if(v) out.push(v); });
  local.forEach(p=>{ if(done.has(p._id)) return; done.add(p._id); const v=pick(p._id); if(v) out.push(v); });
  return { data: out, localWins, remoteNew };
}

  const btn=document.getElementById("githubLoadB");

const LOG_FILE="changelog.json", LOG_MAX=2000;
const LOG_FIELDS={n:"Nom",p:"PLU",c:"CUP",cat:"Catégorie",tags:"Tags",notes:"Notes",photo:"Photo"};
function fmtVal(k,v){ if(k==="photo") return v?"oui":"non"; if(Array.isArray(v)) return v.join(", "); return (v===undefined||v===null||v==="")?"∅":String(v); }
function diffProduct(a,b){
  const ch={};
  for(const k in LOG_FIELDS){
    const o=a?fmtVal(k,a[k]):undefined, n=b?fmtVal(k,b[k]):undefined;
    if(!a){ if(n!=="∅" && n!=="non") ch[k]=["∅",n]; }
    else if(!b){ if(o!=="∅" && o!=="non") ch[k]=[o,"∅"]; }
    else if(o!==n) ch[k]=[o,n];
    else if(k==="photo" && a.photo && b.photo && a.photo.v!==b.photo.v) ch[k]=["oui","nouvelle photo"];
  }
  return ch;
}

async function idbOp(mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction("img",mode); const st=tx.objectStore("img"); const r=fn(st); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); }); }

function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{
      const MAX=240; let w=im.width,h=im.height; const sc=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      let q=0.7, d=cv.toDataURL("image/jpeg",q);
      while(d.length*0.75>20000 && q>0.35){ q-=0.1; d=cv.toDataURL("image/jpeg",q); }
      res(d);
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("format non supporté")); };
    im.src=url;
  });
}

async function pushPhotos(){
  const all=await photoAll(); const keys=await idbOp("readonly",st=>st.getAllKeys()).catch(()=>[]);
  const pend=[]; all.forEach((v,i)=>{ if(v && v.pending) pend.push([keys[i],v]); });
  const dels=getJSON("plu_img_del",[]);
  if(!pend.length && !dels.length) return {up:0,del:0,fail:0};
  const shas={}; (await listDir("images")).forEach(e=>shas[e.name]=e.sha);
  let up=0,del=0,fail=0;
  for(const [id,v] of pend){
    const body={message:"Photo produit "+id, content:v.data.split(",")[1], branch:"main"};
    if(shas[id+".jpg"]) body.sha=shas[id+".jpg"];
    const r=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${photoPath(id)}`,{method:"PUT",headers:ghHeaders(true),body:JSON.stringify(body)});
    if(r.ok){ const j=await r.json().catch(()=>({})); v.pending=false; v.sha=j.content&&j.content.sha; await photoPut(id,v); up++; } else fail++;
  }
  const left=[];
  for(const id of dels){
    const sha=shas[id+".jpg"]; if(!sha){ del++; continue; }
    const r=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${photoPath(id)}`,{method:"DELETE",headers:ghHeaders(true),body:JSON.stringify({message:"Suppression photo "+id, sha, branch:"main"})});
    if(r.ok||r.status===404) del++; else { fail++; left.push(id); }

  setJSON("plu_img_del",left);
  return {up,del,fail};
}

// Lit un fichier JSON à la racine du repo (SHA via la liste du dossier, contenu en brut : marche au-delà de 1 Mo)
async function fetchFile(name){
  const entry=(await listDir("")).find(e=>e.name===name);
  if(!entry) return {data:null, sha:null};
  const h=ghHeaders(); h["Accept"]="application/vnd.github.raw";
  const res=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${name}?ref=main&t=${Date.now()}`,{headers:h,cache:"no-store"});
  if(!res.ok) throw new Error("GitHub "+res.status);
  const data=JSON.parse(await res.text());
  if(!Array.isArray(data)) throw new Error("Fichier GitHub invalide");
  return {data, sha:entry.sha};
}

        P=merged; setBase(merged, r.content && r.content.sha); saveLocal(); refreshUI();
        let extra="";
        try{ setStatus("⬆️ Envoi des photos…"); const ph=await pushPhotos(); if(ph.up||ph.del) extra+=`\n📷 Photos : ${ph.up} envoyée(s), ${ph.del} retirée(s).`; if(ph.fail) extra+=`\n⚠️ ${ph.fail} photo(s) non envoyée(s) — réessaie 💾.`; }
        catch(e){ extra+="\n⚠️ Photos non envoyées ("+e.message+") — réessaie 💾."; }
        try{ setStatus("⬆️ Envoi du journal…"); const n=await pushLog(); if(n) extra+=`\n📜 Journal : ${n} entrée(s) ajoutée(s).`; }
        catch(e){ extra+="\n⚠️ Journal non envoyé ("+e.message+") — réessaie 💾."; }
        const msg=`✅ Sauvegardé sur GitHub (${fmtTime()}).`+(stats.remoteNew?`\n${stats.remoteNew} changement(s) faits par les autres ont été récupérés.`:"")+extra;
        setStatus(msg.replace("\n"," ")); alert(msg); return;
      }
      const err = await putRes.json().catch(() => ({}));
      lastErr = new Error(err.message || putRes.statusText);
      lastErr.status = putRes.status;
      if(putRes.status===409 || putRes.status===422){ setStatus("⚠️ Quelqu'un vient de sauvegarder — nouvelle fusion…"); continue; }
      break;
    }
    throw lastErr;
  } catch (e) {
    console.error(e);
    if(e.status===409||e.status===422){
      setStatus("⚠️ Conflit : réessaie 💾 dans quelques secondes.");
      alert("⚠️ Quelqu'un d'autre sauvegarde en même temps. Rien n'est perdu : réessaie 💾 dans quelques secondes.");
    } else if(e.status===401||e.status===403||e.status===404){
      setStatus("❌ Erreur GitHub : "+e.message);
      alert("❌ Erreur GitHub : " + e.message + "\n\nVérifie le token et les permissions.");
      if (confirm("Effacer le token sauvegardé et réessayer ?")) localStorage.removeItem("github_token");
    } else {
      setStatus("📴 Pas de connexion — tes modifications restent dans le téléphone.");
      alert("📴 Impossible de joindre GitHub (" + e.message + ").\nTes modifications sont gardées dans le téléphone ; réessaie 💾 quand tu auras du réseau.");
    }
  } finally { btn.textContent = original; btn.disabled = false; }
}

// Chargement des données au démarrage : copie locale (ou fichier fourni), puis synchro GitHub si en ligne
async function loadExternalData() {
  let ok=false;
  try {
    const local = localStorage.getItem("plu_data_local");
    if (local) { const data = JSON.parse(local); if (Array.isArray(data) && data.length > 0) { P = data; ok=true; } }
  } catch(e) {}
  if(!ok){
    try {
      const res = await fetch("./plu_data.json?t=" + Date.now());
      if (res.ok) { const data = await res.json(); if (Array.isArray(data) && data.length > 0) { P = data; ok=true; } }
    } catch (e) { console.log("Pas de plu_data.json externe"); }
  }
  ensureIds(P); saveLocal();
  return ok;
}

try {
  loadExternalData().then(loaded => {
    updateTagFilter();
    updateCatFilter();
    q = "";
    renderMain();
    syncFromGitHub(false);
    setTimeout(askNameOnce, 800);
  }).catch(() => {
    updateTagFilter();
    updateCatFilter();
    q = "";
    renderMain();
  });
  // Si toujours vide, forcer un rendu direct
  if (!document.getElementById("res").children.length) {
    const pluItems = P.filter(p => p.p && p.p.trim()).slice(0, 60);
    if (pluItems.length) {
      renderList(document.getElementById("res"), pluItems);
      document.getElementById("emp").style.display = "none";
    }
  }
} catch(e) {
  console.error("Init error:", e);
  setTimeout(() => {
    try {
      q = "";
      const pluItems = P.filter(p => p.p && p.p.trim()).slice(0, 60);
      if (pluItems.length) {
        renderList(document.getElementById("res"), pluItems);
        document.getElementById("emp").style.display = "none";
      }
    } catch(e2) {
      console.error("Fallback failed:", e2);
    }
  }, 150);
}
