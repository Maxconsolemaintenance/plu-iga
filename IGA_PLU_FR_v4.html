let cur = null, editIdx = -1, q = "";
let codeReader = null;

function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}

function getTags(){
  const t = new Set();
  P.forEach(p=>(p.tags||[]).forEach(x=>t.add(x)));
  return [...t].sort();
}

function updateTagFilter(){
  const sel = document.getElementById("tagF");
  const c = sel.value;
  sel.innerHTML = '<option value="">Tous tags</option>' + getTags().map(t=>`<option value="${t}">${t}</option>`).join("");
  if(getTags().includes(c)) sel.value = c;
}

function filterList(query){
  const nq = norm(query);
  const cat = document.getElementById("catF").value;
  const tag = document.getElementById("tagF").value;
  return P.filter(p=>{
    if(cat && p.cat !== cat) return false;
    if(tag && !(p.tags||[]).includes(tag)) return false;
    if(nq.length >= 1 && !norm(p.n).includes(nq) && !(p.p||"").includes(query) && !(p.c||"").includes(query)) return false;
    return true;
  }).slice(0, 60);
}

function renderList(container, items){
  if(!items.length){container.innerHTML = ""; return;}
  container.innerHTML = items.map(p=>`
    <div class="item" data-i="${P.indexOf(p)}">
      <div class="thumb"></div>
      <div class="info">
        <div class="name">${p.n}</div>
        <div class="meta">${p.cat||""} ${p.p?'<span class="plu">PLU '+p.p+'</span>':''}</div>
      </div>
    </div>
  `).join("");
  container.querySelectorAll(".item").forEach(el=>{
    el.onclick = ()=>show(P[parseInt(el.dataset.i)]);
  });
}

function renderMain(){
  const items = filterList(q);
  const r = document.getElementById("res");
  const e = document.getElementById("emp");
  if(!items.length){r.innerHTML=""; e.style.display="block"; return;}
  e.style.display="none";
  renderList(r, items);
}

function show(p){
  cur = p;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("d").classList.add("active");
  document.getElementById("dn").textContent = p.n;
  document.getElementById("dc").textContent = p.cat || "";
  document.getElementById("dp").textContent = p.p || "—";
  document.getElementById("dt").innerHTML = (p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("");
  document.getElementById("dno").textContent = p.notes || "";
  const svg = document.getElementById("bc");
  svg.innerHTML = "";
  const code = (p.c||"").replace(/-/g,"") || p.p || "";
  if(code){
    try{ JsBarcode("#bc", code, {format:"CODE128", width:1.8, height:55, displayValue:false, margin:0}); }
    catch(e){}
  }
  document.getElementById("qd").value = "";
  document.getElementById("resd").innerHTML = "";
}

function goMain(){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("s").classList.add("active");
  document.getElementById("q").value = q;
  document.getElementById("q").focus();
  renderMain();
}

function openForm(p, idx){
  editIdx = idx;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("f").classList.add("active");
  document.getElementById("ftitle").textContent = p ? "Modifier" : "Nouveau produit";
  document.getElementById("fn").value = p ? p.n : "";
  document.getElementById("fp").value = p ? p.p : "";
  document.getElementById("fc").value = p ? p.c : "";
  document.getElementById("fcat").value = p ? p.cat : "";
  document.getElementById("ft").value = p ? (p.tags||[]).join(", ") : "";
  document.getElementById("fno").value = p ? p.notes : "";
}

function scanFromPhoto(targetField){
  const input = document.getElementById("camInput");
  input.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    try{
      if(!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();
      const result = await codeReader.decodeFromImageUrl(url);
      const code = result.text;
      if(targetField){
        document.getElementById(targetField).value = code;
      } else {
        q = code;
        document.getElementById("q").value = code;
        renderMain();
      }
    }catch(err){
      alert("Aucun code-barres détecté dans la photo");
    }
    URL.revokeObjectURL(url);
    input.value = "";
  };
  input.click();
}

// Main search
document.getElementById("q").oninput = e=>{ q = e.target.value; renderMain(); };
document.getElementById("catF").onchange = renderMain;
document.getElementById("tagF").onchange = renderMain;

// Detail search
document.getElementById("qd").oninput = e=>{
  const items = filterList(e.target.value);
  renderList(document.getElementById("resd"), items);
};

document.getElementById("backB").onclick = goMain;
document.getElementById("fbackB").onclick = goMain;
document.getElementById("addB").onclick = ()=>openForm(null, -1);
document.getElementById("editB").onclick = ()=>openForm(cur, P.indexOf(cur));

document.getElementById("fsaveB").onclick = ()=>{
  const obj = {
    n: document.getElementById("fn").value.trim(),
    p: document.getElementById("fp").value.trim(),
    c: document.getElementById("fc").value.trim(),
    cat: document.getElementById("fcat").value.trim(),
    tags: document.getElementById("ft").value.split(",").map(t=>t.trim()).filter(Boolean),
    notes: document.getElementById("fno").value.trim(),
    img: editIdx >= 0 ? P[editIdx].img : ""
  };
  if(!obj.n) return;
  if(editIdx >= 0) P[editIdx] = obj;
  else P.unshift(obj);
  updateTagFilter();
  goMain();
};

// Voice search (shared)
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "fr-CA";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
}

function startVoice(targetInput, after){
  if(!recognition){ alert("Recherche vocale non supportée"); return; }
  recognition.onresult = e=>{
    const text = e.results[0][0].transcript;
    targetInput.value = text;
    if(after) after(text);
  };
  try{ recognition.start(); } catch(e){}
}

document.getElementById("voiceB").onclick = ()=>{
  startVoice(document.getElementById("q"), text=>{
    q = text;
    renderMain();
  });
};

document.getElementById("voiceBd").onclick = ()=>{
  startVoice(document.getElementById("qd"), text=>{
    const items = filterList(text);
    renderList(document.getElementById("resd"), items);
  });
};

// Photo barcode scan
document.getElementById("scanB").onclick = ()=>scanFromPhoto(null);
document.getElementById("fscanB").onclick = ()=>scanFromPhoto("fc");

updateTagFilter();
renderMain();
</script>
</body>
</html>
